[project]
name = "speak-tui"
version = "0.2.0"
description = "A full-screen TUI for macOS's built-in say — type to talk, with history and saved phrases"
requires-python = ">=3.11"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Naydichev" }]
keywords = ["tts", "speech", "accessibility", "aac", "macos", "textual", "tui"]
dependencies = ["textual>=0.80"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Adaptive Technologies",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Without these the PyPI page has no way back to the source.
[project.urls]
Homepage = "https://github.com/naydichev/speak"
Repository = "https://github.com/naydichev/speak"
Issues = "https://github.com/naydichev/speak/issues"

[project.scripts]
speak = "speak.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speak"]

# The README is also the PyPI page, and PyPI cannot resolve a relative image
# path. Keep the paths relative in the file — so they render locally and on
# GitHub — and absolutise them only in the packaged metadata.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images need raw.githubusercontent (the bytes); links need blob (a rendered
# page). This pair runs in order, so the image rule claims its matches first
# and the link rule only sees what is left.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\(docs/'
replacement = '\g<1>(https://raw.githubusercontent.com/naydichev/speak/main/docs/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(docs/'
replacement = '](https://github.com/naydichev/speak/blob/main/docs/'


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
